name: Android Release

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (например 1.2.0)'
        required: false
        default: '1.2.0'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Read version from pubspec
        id: ver
        run: |
          FULL=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "full=$FULL" >> $GITHUB_OUTPUT
          echo "name=${FULL%%+*}" >> $GITHUB_OUTPUT
          echo "code=${FULL##*+}" >> $GITHUB_OUTPUT

      - name: Restore release keystore
        uses: actions/cache@v4
        id: keystore-cache
        with:
          path: mobile/android/app/upload-keystore.jks
          key: android-upload-keystore-v1

      - name: Prepare release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
            echo "Using keystore from GitHub Secret"
          elif [ ! -f android/app/upload-keystore.jks ]; then
            keytool -genkey -v -keystore android/app/upload-keystore.jks \
              -storetype JKS -keyalg RSA -keysize 2048 -validity 10000 \
              -alias upload -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'DietaUpload2026!' }}" \
              -keypass "${{ secrets.ANDROID_KEY_PASSWORD || 'DietaUpload2026!' }}" \
              -dname "CN=Tvoy Dietolog, OU=Mobile, O=GermannM3, L=MSK, ST=MSK, C=RU"
            echo "::notice::Created new upload keystore (cached for future builds)"
          fi
          cat > android/key.properties << EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'DietaUpload2026!' }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD || 'DietaUpload2026!' }}
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

      - name: Patch AndroidManifest for HTTP API
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'usesCleartextTraffic' "$MANIFEST"; then
            sed -i 's|<application|<application android:usesCleartextTraffic="true"|' "$MANIFEST"
          fi
          sed -i 's|android:label="[^"]*"|android:label="Твой Диетолог"|' "$MANIFEST" || true

      - name: Setup Android local.properties
        run: echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Create build secrets file
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          APP_NAME: ${{ secrets.APP_NAME }}
        run: |
          cat > dart_defines.json << EOF
          {
            "API_BASE_URL": "${API_BASE_URL:-http://5.129.198.80:8000}",
            "APP_NAME": "${APP_NAME:-Твой Диетолог}",
            "GITHUB_REPO": "GermannM3/dieta"
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release --dart-define-from-file=dart_defines.json

      - name: Build App Bundle
        run: flutter build appbundle --release --dart-define-from-file=dart_defines.json

      - name: Determine version tag
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=android-v${{ github.event.inputs.version || steps.ver.outputs.name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Android ${{ steps.version.outputs.tag }}
          body: |
            ## Твой Диетолог — Android

            buildNumber: ${{ steps.ver.outputs.code }}

            Скачайте APK и установите на телефон. Если раньше стояла версия с другой подписью — удалите её один раз, затем все обновления ставятся поверх.

            **Функции:**
            - Автообновление из GitHub Releases
            - Путь осознанного питания, streak, % жира
            - ИИ-диетолог с памятью диалога
            - Трекинг калорий, воды, БЖУ

            API: `${{ secrets.API_BASE_URL || 'http://5.129.198.80:8000' }}`
          files: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
